services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    networks:
      - proxy_net
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    name: portainer_data

networks:
  proxy_net:
    external: true
