name: portainer

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:sts
    networks:
      - proxy_net
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PORTAINER_DATA}:/data

networks:
  proxy_net:
    external: true
