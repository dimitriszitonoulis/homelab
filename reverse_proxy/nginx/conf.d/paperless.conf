
server {
    # Check the official nginx config for paperless
    # https://github.com/paperless-ngx/paperless-ngx/wiki/Using-a-Reverse-Proxy-with-Paperless-ngx#nginx
    listen 443 ssl;
    # listen [::]:443 ssl; # Listen on IPv6 port 80

    # Adjust as required. This is the maximum size for file uploads.
    # The default value 1M might be a little too small.
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;

    # Set headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;


    proxy_redirect off;

    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "same-origin" always;

    server_name paperless.mydomain.com;

	location / {
		proxy_pass http://paperless_webserver:8000;
	}


    # Referrer-Policy: no-referrer everywhere except the login page, which needs
    # same-origin so Django's CSRF check gets a real Origin header instead of "null"
    # on the login POST (see Troubleshooting below). proxy_hide_header clears any
    # Referrer-Policy already set upstream/elsewhere before add_header sets your own.
    location ~ ^/accounts/(signup|login)/ {
        proxy_pass http://paperless_webserver:8000;
    }
}




server {
    # Check the official nginx config for paperless
    # https://github.com/paperless-ngx/paperless-ngx/wiki/Using-a-Reverse-Proxy-with-Paperless-ngx#nginx
    # I haved gathered some of the stuff that has the same for both directives.
    listen 443 ssl;
    # listen [::]:443 ssl; # Listen on IPv6 port 80

    # Adjust as required. This is the maximum size for file uploads.
    # The default value 1M might be a little too small.
    client_max_body_size 100M;

    # These configuration options are required for WebSockets to work.
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Proto $scheme;


    proxy_redirect off;

    proxy_hide_header Referrer-Policy;

    # Referrer-Policy: no-referrer everywhere except the login page, which needs
    # same-origin so Django's CSRF check gets a real Origin header instead of "null"
    # on the login POST (see Troubleshooting below). proxy_hide_header clears any
    # Referrer-Policy already set upstream/elsewhere before add_header sets your own.
    location ~ ^/accounts/(signup|login)/ {

        proxy_pass http://paperless_webserver:8000;

        proxy_set_header Host $host:$server_port;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://paperless_webserver:8000;

        proxy_set_header Host $host;
        add_header Referrer-Policy "no-referrer" always;
    }
}

