user             nginx;
worker_processes auto;

# [ debug | info | notice | warn | error | crit ]
error_log        /var/log/nginx/error.log notice;
pid              /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # access_log  /var/log/nginx/access.log  main;


    log_format main      '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$gzip_ratio"';

    log_format download  '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$http_range" "$sent_http_content_range"';

    client_header_timeout  3m;
    client_body_timeout    3m;
    send_timeout           3m;

    client_header_buffer_size    1k;
    large_client_header_buffers  4 4k;

    gzip on;
    gzip_min_length  1100;
    gzip_buffers     4 8k;
    gzip_types       text/plain;

    output_buffers   1 32k;
    postpone_output  1460;

    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;
    # send_lowat       12000;

    keepalive_timeout  75 20;

    lingering_time     30;
    lingering_timeout  10;
    reset_timedout_connection  on;

    server {
        listen 80;
        listen [::]:80;

        server_name git.mydomain.com
                homarr.mydomain.com
                immich.mydomain.com
                jellyfin.mydomain.com
                kosync.mydomain.com
                miniflux.mydomain.com
                nextcloud.mydomain.com
                paperless.mydomain.com
                pihole.mydomain.com
                portainer.mydomain.com
                searxng.mydomain.com
                wallabag.mydomain.com
            ;

        # If the http challenge is used uncomment
        #        location ~ /.well-known/acme-challenge/ {
        #            root /var/www/certbot
        #        }

        return 301 https://$host$request_uri;
    }

    server {
        listen      80 default_server;
        listen      [::]:80 default_server;

        server_name _;

        return 404;
    }

    # Catch-all: Drop unknown subdomains on HTTPS
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        # Instantly terminates the connection without serving a certificate
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
